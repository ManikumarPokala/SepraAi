# SepraAI v2.7 — Docker Compose Infrastructure
# Satisfies Patch #9: Enforces AZ-alignment metadata to avoid Cross-AZ data egress.

version: '3.8'

services:
  # ── Core Database ───────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.5.0-pg15
    container_name: sepraai-postgres
    environment:
      POSTGRES_DB: sepraai
      POSTGRES_USER: sepraai
      POSTGRES_PASSWORD: sepraai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels:
      - "com.sepraai.aws.zone=us-east-1a" # Pinned to avoid cross-AZ egress costs (Patch #9)
    networks:
      - sepraai-net

  # ── Task Queue Broker ──────────────────────────────────────────────────
  redis:
    image: redis:7.0-alpine
    container_name: sepraai-redis
    ports:
      - "6379:6379"
    labels:
      - "com.sepraai.aws.zone=us-east-1a"
    networks:
      - sepraai-net

  # ── Object Storage ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2023-05-18T00-05-36Z
    container_name: sepraai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    labels:
      - "com.sepraai.aws.zone=us-east-1a"
    networks:
      - sepraai-net

  # ── Gateway API ─────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ..
      dockerfile: ./infrastructure/docker/Dockerfile.api
    container_name: sepraai-api-gateway
    environment:
      - SEPRAAI_DATABASE_URL=postgresql+asyncpg://sepraai:sepraai@postgres:5432/sepraai
      - SEPRAAI_REDIS_URL=redis://redis:6379/0
      - SEPRAAI_MINIO_ENDPOINT=minio:9000
      - AWS_ZONE=us-east-1a # Align Gateway zone
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    labels:
      - "com.sepraai.aws.zone=us-east-1a"
    networks:
      - sepraai-net

  # ── Workers ─────────────────────────────────────────────────────────────
  worker-manim:
    build:
      context: ..
      dockerfile: ./infrastructure/docker/Dockerfile.worker.manim
    container_name: sepraai-worker-manim
    environment:
      - SEPRAAI_DATABASE_URL=postgresql+asyncpg://sepraai:sepraai@postgres:5432/sepraai
      - SEPRAAI_REDIS_URL=redis://redis:6379/0
      - SEPRAAI_MINIO_ENDPOINT=minio:9000
      - AWS_ZONE=us-east-1a # Align Worker zone to minimize storage egress
    depends_on:
      - redis
      - postgres
      - minio
    labels:
      - "com.sepraai.aws.zone=us-east-1a"
    networks:
      - sepraai-net

  worker-remotion:
    build:
      context: ..
      dockerfile: ./infrastructure/docker/Dockerfile.worker.remotion
    container_name: sepraai-worker-remotion
    environment:
      - SEPRAAI_DATABASE_URL=postgresql+asyncpg://sepraai:sepraai@postgres:5432/sepraai
      - SEPRAAI_REDIS_URL=redis://redis:6379/0
      - SEPRAAI_MINIO_ENDPOINT=minio:9000
      - AWS_ZONE=us-east-1a
    depends_on:
      - redis
      - postgres
      - minio
    labels:
      - "com.sepraai.aws.zone=us-east-1a"
    networks:
      - sepraai-net

volumes:
  pgdata:
  miniodata:

networks:
  sepraai-net:
    driver: bridge
